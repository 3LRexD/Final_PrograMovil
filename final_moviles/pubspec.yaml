name: final_moviles
description: "Aplicación de primeros auxilios y navegación en desastres."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter_dotenv: ^5.1.0
  flutter:
    sdk: flutter
  get_storage: ^2.1.1
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  http: ^1.2.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.1.0
  tflite_flutter: ^0.12.1
  image: ^4.3.0
  google_fonts: ^8.1.0
  just_audio: ^0.9.40
  path_provider: ^2.1.3
  sqflite: ^2.4.2+1
  path: ^1.9.1
  json_annotation: ^4.12.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/models/best_float16_new.tflite
    - assets/ml_models/minilm.tflite      
    - assets/ml_models/vocab.txt
    - assets/offline_rag.db
    - .env
