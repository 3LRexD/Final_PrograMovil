#configuracion del modelo de primeros auxilios yolo v8
#creado el 2024 11 15
#framework pytorch 20
#cuda 118

model:
  architecture: "YOLOv8"
  backbone: "CSPDarknet"
  neck: "PAN"
  head: "YOLO"
  depth_multiple: 1.0
  width_multiple: 1.0

input:
  image_size: 640
  channels: 3
  normalization: "ImageNet"
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

inference:
  confidence_threshold: 0.45
  iou_threshold: 0.5
  max_detections: 100
  device: "auto"
  half_precision: true

classes:
  0: "cortadura"
  1: "quemadura"
  2: "hematoma"
  3: "inflamacion"
  4: "sangrado"
  5: "fractura_sospechada"
  6: "lesion_abierta"

augmentation:
  - type: "horizontal_flip"
    probability: 0.5
  - type: "vertical_flip"
    probability: 0.1
  - type: "rotation"
    degrees: [-15, 15]
    probability: 0.5
  - type: "brightness"
    factor: [0.7, 1.3]
    probability: 0.3
  - type: "saturation"
    factor: [0.7, 1.3]
    probability: 0.3

training:
  batch_size: 16
  num_workers: 8
  optimizer: "SGD"
  learning_rate: 0.001
  momentum: 0.937
  weight_decay: 0.0005
  epochs: 300
  warmup_epochs: 3
  warmup_momentum: 0.8
  scheduler: "cosine"

performance:
  map50: 0.89
  map50_95: 0.74
  inference_time_ms: 45
  fps_gpu: 22
  fps_cpu: 2.5
